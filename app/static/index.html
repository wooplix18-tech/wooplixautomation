<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wooplix AI SDLC</title>
  <style>
    :root { --ink:#e9eef7; --muted:#93a3bb; --panel:#111a2b; --panel-2:#18243a; --line:#263653; --accent:#66e4c2; --accent-2:#8f7cff; --danger:#ff8c9b; --shadow:0 24px 70px #02061066; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#08101f; font:14px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
    button, input, textarea, select { font:inherit; }
    button { cursor:pointer; border:0; }
    .shell { display:grid; grid-template-columns:300px 1fr; min-height:100vh; }
    aside { padding:28px 20px; border-right:1px solid var(--line); background:linear-gradient(180deg,#0b1527,#091221); }
    .brand { display:flex; align-items:center; gap:11px; padding:0 8px 32px; }
    .logo { width:36px; height:36px; display:grid; place-items:center; border-radius:12px; color:#08101f; font-weight:900; background:linear-gradient(135deg,var(--accent),#73a7ff); }
    .brand strong { letter-spacing:-.03em; font-size:18px; }
    .brand small { display:block; color:var(--muted); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
    .side-label { color:#5f7392; font-size:10px; letter-spacing:.15em; text-transform:uppercase; padding:0 10px 10px; }
    .project-list { display:grid; gap:7px; }
    .project { width:100%; text-align:left; color:var(--ink); padding:12px 11px; border:1px solid transparent; border-radius:10px; background:transparent; }
    .project:hover,.project.active { background:var(--panel); border-color:var(--line); }
    .project-name { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:650; }
    .project-meta { color:var(--muted); font-size:11px; margin-top:3px; }
    .new-project { width:100%; margin-top:18px; padding:11px; border:1px dashed #3d567d; color:var(--accent); border-radius:10px; background:#0c1729; }
    main { max-width:1500px; width:100%; padding:34px clamp(20px,4vw,64px) 60px; margin:auto; }
    .topline { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:25px; }
    h1 { margin:0; letter-spacing:-.045em; font-size:clamp(28px,3vw,44px); line-height:1.05; }
    h2 { margin:0; font-size:20px; letter-spacing:-.025em; }
    h3 { margin:0 0 10px; font-size:14px; }
    .eyebrow { margin:0 0 10px; color:var(--accent); letter-spacing:.14em; text-transform:uppercase; font-weight:700; font-size:11px; }
    .subtitle { color:var(--muted); max-width:680px; margin:12px 0 0; }
    .badge { display:inline-flex; align-items:center; gap:6px; padding:5px 9px; border-radius:999px; color:#b9c8dd; background:#15223a; font-size:11px; }
    .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); }
    .grid { display:grid; gap:16px; grid-template-columns:repeat(12,1fr); }
    .card { grid-column:span 12; border:1px solid var(--line); border-radius:16px; padding:20px; background:linear-gradient(145deg,#121d31,#0f1829); box-shadow:var(--shadow); }
    .card.half { grid-column:span 6; }
    .card.third { grid-column:span 4; }
    .card-header { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:17px; }
    .muted { color:var(--muted); }
    .small { font-size:12px; }
    .empty { min-height:56vh; display:grid; place-items:center; text-align:center; }
    .empty-inner { max-width:560px; }
    .empty-mark { font-size:44px; margin-bottom:12px; }
    .button { padding:10px 14px; color:#07121c; border-radius:9px; font-weight:750; background:var(--accent); }
    .button.secondary { color:var(--ink); background:#1c2b46; }
    .button.ghost { color:var(--accent); background:transparent; border:1px solid #385174; }
    .button.danger { color:#220910; background:var(--danger); }
    .button:disabled { opacity:.5; cursor:not-allowed; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    form { display:grid; gap:13px; }
    .form-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:13px; }
    label { display:grid; gap:6px; color:#b7c4d7; font-size:12px; font-weight:650; }
    input, textarea, select { width:100%; color:var(--ink); outline:none; border:1px solid #2b4163; border-radius:8px; background:#0a1425; padding:10px 11px; }
    input:focus,textarea:focus,select:focus { border-color:var(--accent-2); box-shadow:0 0 0 3px #8f7cff1f; }
    textarea { resize:vertical; min-height:92px; }
    .full { grid-column:1/-1; }
    .steps { display:flex; overflow:auto; gap:0; padding-bottom:6px; }
    .step { min-width:130px; position:relative; padding:8px 11px 0 0; color:#617696; font-size:11px; }
    .step:not(:last-child)::after { content:""; height:1px; position:absolute; top:14px; left:20px; right:8px; background:#2b3d5b; }
    .step-dot { display:block; width:12px; height:12px; position:relative; z-index:1; margin-bottom:8px; border:3px solid #354c70; border-radius:50%; background:#0b1527; }
    .step.done { color:var(--accent); }.step.done .step-dot { border-color:var(--accent); background:var(--accent); }.step.current { color:var(--ink); }.step.current .step-dot { border-color:var(--accent-2); background:var(--accent-2); }
    .gate { border-color:#725fff; background:linear-gradient(145deg,#1a1e42,#121a31); }
    .gate h2 { color:#e4ddff; }.gate .question { margin:8px 0; padding:9px 10px; border-left:2px solid var(--accent-2); background:#111832; color:#c6cce0; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
    .stat { padding:13px; border:1px solid var(--line); border-radius:10px; background:#0d1728; }.stat b { display:block; font-size:22px; color:var(--accent); }.stat span { display:block; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
    .artifact-list { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; }
    .agent-list { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .agent-card { min-height:132px; padding:13px; border:1px solid var(--line); border-radius:10px; background:#0d1728; }
    .agent-card strong { display:block; font-size:13px; }
    .agent-card small { display:block; color:var(--muted); margin-top:4px; }
    .agent-card p { color:#b9c8dd; font-size:11px; margin:9px 0 0; }
    .agent-status { display:inline-flex; margin-top:9px; padding:3px 7px; border-radius:999px; color:var(--accent); background:#12332f; font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
    .agent-status.planned { color:#ffcf8a; background:#3c2c18; }
    .agent-status.human { color:#c9bcff; background:#29234a; }
    .artifact { padding:12px; border:1px solid var(--line); border-radius:10px; background:#0d1728; }.artifact strong { display:block; font-size:13px; }.artifact small { color:var(--muted); }.artifact button { margin-top:10px; padding:6px 8px; color:var(--accent); border:1px solid #315173; border-radius:6px; background:transparent; font-size:11px; }
    .trace { display:grid; gap:0; max-height:420px; overflow:auto; }.trace-row { display:grid; grid-template-columns:120px 1fr; gap:13px; padding:10px 0; border-bottom:1px solid #1b2a42; }.trace-row time { color:#6980a2; font-size:11px; }.trace-row strong { display:block; font-size:12px; }.trace-row span { color:var(--muted); font-size:12px; }
    pre { overflow:auto; max-height:520px; margin:0; padding:15px; border-radius:10px; color:#cbd8ee; background:#091221; font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .toast { position:fixed; right:20px; bottom:20px; max-width:360px; padding:12px 15px; border:1px solid var(--line); border-radius:10px; background:#172641; box-shadow:var(--shadow); }
    @media (max-width:900px) { .shell { display:block; } aside { border-right:0; border-bottom:1px solid var(--line); padding:16px; } .brand { padding-bottom:16px; }.project-list { display:flex; overflow:auto; }.project { min-width:190px; }.new-project { width:auto; }.card.half,.card.third { grid-column:span 12; } }
    @media (max-width:580px) { main { padding:24px 14px 40px; }.form-grid { grid-template-columns:1fr; }.stats { grid-template-columns:repeat(2,1fr); }.artifact-list,.agent-list { grid-template-columns:1fr; }.topline { display:block; }.topline .badge { margin-top:15px; } }

    .inquiry-layout { display:grid; grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr); gap:18px; align-items:start; }
    .chat-card { padding:0; overflow:hidden; }
    .chat-top { padding:20px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .chat-top h2 { font-size:18px; }
    .chat-messages { padding:24px; display:grid; gap:16px; max-height:500px; min-height:230px; overflow:auto; }
    .chat-message { max-width:90%; padding:14px 16px; border:1px solid var(--line); border-radius:14px 14px 14px 3px; background:#18243a; white-space:pre-wrap; overflow-wrap:anywhere; }
    .chat-message.user { justify-self:end; border-radius:14px 14px 3px 14px; background:#173c3b; border-color:#27625b; }
    .chat-message strong { display:block; margin-bottom:7px; font-size:11px; color:var(--accent); }
    .chat-compose { padding:18px 22px; border-top:1px solid var(--line); background:#101a2b; }
    .chat-compose textarea { min-height:110px; }
    .chat-compose .actions { justify-content:space-between; align-items:center; }
    .upload-label { display:inline-flex; cursor:pointer; padding:9px 12px; color:var(--ink); border:1px solid #385174; border-radius:9px; }
    .upload-label:has(input:disabled) { opacity:.5; cursor:not-allowed; }
    .upload-label input { width:1px; height:1px; opacity:0; padding:0; position:absolute; }
    .upload-label:focus-within { outline:2px solid var(--accent); outline-offset:3px; }
    .inquiry-summary { display:grid; gap:18px; }
    .inquiry-summary p { margin:0; }
    .deliverable-list { display:grid; gap:10px; padding-left:18px; color:#bdcbe0; }
    .inquiry-note { margin-top:14px; padding:12px; border-radius:9px; background:#0c1729; }
    .chat-message.pending { color:var(--muted); }
    .inquiry-status { font-size:12px; color:var(--accent); }
    @media(max-width:1050px) { .inquiry-layout { grid-template-columns:1fr; } .chat-messages { max-height:420px; } }
    @media(max-width:580px) { .chat-top,.chat-compose { padding:16px; } .chat-messages { padding:16px; } .chat-message { max-width:100%; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><div class="logo">W</div><div><strong>Wooplix</strong><small>AI software delivery</small></div></div>
      <div class="side-label">Projects</div>
      <div id="project-list" class="project-list"><div class="muted small" style="padding:10px">Loading workspace…</div></div>
      <button class="new-project" onclick="showCreate(true)">＋ New inquiry</button>
    </aside>
    <main id="main"></main>
  </div>
  <div id="toast" hidden class="toast" role="status" aria-live="polite"></div>
  <script>
    const stages = [
      ['client_requirements','Client requirements'],['proposal','Proposal'],['brd','BRD'],['ui_ux','UI/UX'],['implementation','Development'],['qa_uat','Testing & UAT'],['documentation','Docs'],['delivery_review','Review'],['uat','Client UAT'],['handover','Handover']
    ];
    let projects = [], selected = null, agentCatalog = [];
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const pretty = value => JSON.stringify(value, (key,item)=>/^(planning_target|traditional_hours|ai_assisted_hours|human_involvement_hours|.*_hours_target)$/.test(key) ? undefined : item, 2);
    let intakeMessages=[], intakeDraft=null, intakeReady=false, intakeBusy=false, intakeAI=false;
    let intakeSourceFilename='', intakeComposer='';
    try {
      const saved=JSON.parse(sessionStorage.getItem('wooplix-intake') || 'null');
      if(saved && Array.isArray(saved.messages)) {
        intakeMessages=saved.messages; intakeDraft=saved.draft; intakeReady=!!saved.ready;
        intakeAI=!!saved.ai; intakeSourceFilename=saved.filename||'';
      }
    } catch {}
    function saveIntake() { try {sessionStorage.setItem('wooplix-intake',JSON.stringify({messages:intakeMessages,draft:intakeDraft,ready:intakeReady,ai:intakeAI,filename:intakeSourceFilename}));} catch {} }
    async function api(path, options={}) {
      const res = await fetch('/api'+path, {...options, headers:options.body instanceof FormData ? {...options.headers} : {'Content-Type':'application/json', ...options.headers}});
      let data;
      try { data = await res.json(); }
      catch { throw new Error(res.ok ? 'The server returned an invalid response.' : `Request failed (${res.status}). Please try again.`); }
      if(!res.ok) {
        const detail = Array.isArray(data.detail) ? data.detail.map(item=>`${item.loc?.slice(1).join('.') || 'Input'}: ${item.msg}`).join('; ') : data.detail;
        throw new Error(typeof detail === 'string' ? detail : 'Request failed. Please try again.');
      }
      return data;
    }
    async function submitForm(form, pendingText, action) {
      if(form.dataset.pending) return;
      form.dataset.pending = 'true';
      const buttons=[...form.querySelectorAll('button')];
      const original=buttons.map(button=>button.textContent);
      buttons.forEach(button=>button.disabled=true);
      if(buttons[0]) buttons[0].textContent=pendingText;
      try { await action(); }
      catch(error) { toast(error.message); }
      finally {
        delete form.dataset.pending;
        buttons.forEach((button,index)=>{button.disabled=false; button.textContent=original[index];});
      }
    }
    function toast(message) { const node=document.querySelector('#toast'); node.textContent=message; node.hidden=false; setTimeout(()=>node.hidden=true, 3800); }
    async function loadProjects() { const [projectResponse, agentResponse]=await Promise.all([api('/projects'), api('/agents')]); projects=projectResponse.projects; agentCatalog=agentResponse.agents; renderProjectList(); if(selected) { const exists=projects.find(p=>p.id===selected.id); if(exists) await selectProject(selected.id); } else if(!document.querySelector('#chat-form') && !document.querySelector('#create-form')) showCreate(); }
    function renderProjectList() { document.querySelector('#project-list').innerHTML=projects.length ? projects.map(p=>`<button class="project ${selected?.id===p.id?'active':''}" onclick="selectProject('${p.id}')"><div class="project-name">${esc(p.project_name)}</div><div class="project-meta">${esc(p.status.replaceAll('_',' '))} · ${p.artifact_count} artifacts</div></button>`).join('') : '<div class="muted small" style="padding:10px">No projects yet.</div>'; }
    function showAdvancedCreate() { selected=null; renderProjectList(); document.querySelector('#main').innerHTML=`<div class="topline"><div><p class="eyebrow">Start with the outcome</p><h1>Turn a brief into a product.</h1><p class="subtitle">A coordinated team of AI agents moves from client requirements through proposal, BRD, design, development, testing, documentation, and handover.</p></div><span class="badge">7 specialist agents · automatic workflow</span></div><div class="card"><div class="card-header"><div><h2>New delivery workspace</h2><div class="muted small">Add enough context for the agents to produce a useful first pass. Unknowns stay visible as open decisions.</div></div></div><form id="create-form"><div class="form-grid"><label>Project name<input name="project_name" required minlength="2" maxlength="120" placeholder="e.g. Field service portal"></label><label>Client name<input name="client_name" maxlength="120" value="Client"></label><label>Project type<select name="project_type"><option value="website">Website</option><option value="mobile_app">Mobile application</option><option value="software_product" selected>Software product</option><option value="internal_tool">Internal tool</option></select></label><label>Workflow<select name="execution_mode"><option value="automatic" selected>Generate everything automatically</option><option value="reviewed">Pause for review at each checkpoint</option></select></label><label>Timeline<input name="timeline" placeholder="e.g. Q3 launch"></label><label class="full">Client brief<textarea name="brief" required minlength="20" maxlength="30000" placeholder="Describe the problem, desired outcome, key capabilities, and how success will be recognized."></textarea></label><label>Business goals<textarea name="goals" placeholder="One goal per line"></textarea></label><label>Target users<textarea name="target_users" placeholder="One user group per line"></textarea></label><label>Platforms<textarea name="platforms" placeholder="Web, iOS, Android, admin…"></textarea></label><label>Integrations<textarea name="integrations" placeholder="CRM, payments, APIs…"></textarea></label><label>Constraints<textarea name="constraints" placeholder="Compliance, brand, budget, technical constraints…"></textarea></label><label>Brand preferences<textarea name="brand_preferences" placeholder="Tone, colors, existing design system…"></textarea></label><label>Budget<input name="budget" placeholder="To be confirmed"></label></div><div class="actions"><button class="button" type="submit">Create workspace →</button><span class="muted small" style="align-self:center">Automatic mode generates the complete delivery pack from your requirements.</span></div></form></div>`; document.querySelector('#create-form').onsubmit=createProject; }
    function showCreate(reset=false) {
      if(intakeBusy) return toast('Please wait for the current inquiry request to finish.');
      selected=null;
      if(reset) {intakeMessages=[]; intakeDraft=null; intakeReady=false; intakeSourceFilename=''; intakeComposer=''; saveIntake();}
      renderProjectList();
      renderInquiry();
    }
    function renderInquiry() {
      const greeting="Hi, I'm your Wooplix project assistant. Tell me what you want to build, paste all your requirements, or upload a document. I'll collect the details and prepare the delivery pack.";
      const messages=[{role:'assistant',content:greeting},...intakeMessages];
      document.querySelector('#main').innerHTML=`
        <div class="topline"><div><p class="eyebrow">Your idea starts here</p><h1>Tell us what you want to build.</h1><p class="subtitle">Share one brief or requirements document. Your AI team turns it into a complete delivery plan.</p></div><span class="badge">One inquiry · complete delivery pack</span></div>
        <div class="inquiry-layout">
          <section class="card chat-card" aria-label="Project inquiry chat">
            <div class="chat-top"><div><h2>Project assistant</h2><span class="muted small">Requirements, questions, and next steps in one conversation.</span></div><span class="badge">${intakeAI?'AI connected':'Guided intake'}</span></div>
            <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-label="Inquiry conversation">${messages.map(m=>`<div class="chat-message ${m.role==='user'?'user':''}"><strong>${m.role==='user'?'You':'Wooplix assistant'}</strong>${esc(m.display || m.content)}</div>`).join('')}${intakeBusy?'<div class="chat-message pending">Working on your inquiry…</div>':''}</div>
            <form id="chat-form" class="chat-compose">
              <label>Your message<textarea id="chat-input" name="message" maxlength="30000" placeholder="I need a website where customers can book services, pay online, and track their requests…" ${intakeBusy?'disabled':''}>${esc(intakeComposer)}</textarea></label>
              <div class="actions"><label class="upload-label">＋ Attach requirements<input id="requirements-file" type="file" accept=".txt,.md,.pdf,.docx" aria-label="Upload requirements document" ${intakeBusy?'disabled':''}></label><button class="button" type="submit" ${intakeBusy?'disabled':''}>Send message →</button></div>
              <span class="muted small">TXT, Markdown, PDF, or Word (.docx) · up to 2 MB. Enter sends; Shift+Enter adds a line.</span>
            </form>
          </section>
          <aside class="card inquiry-summary" style="border:1px solid var(--line);background:linear-gradient(145deg,#121d31,#0f1829);padding:22px;border-radius:16px">
            <div><p class="eyebrow">From inquiry to delivery</p><h2>Your project brief</h2></div>
            <p class="muted">${intakeDraft?'Your requirements are collected below. Answer the assistant or start generation whenever you are ready.':'Start the conversation or attach your requirements. The assistant will organize your brief here.'}</p>
            ${intakeDraft?`<label>Project name<input id="inquiry-project-name" value="${esc(intakeDraft.project_name)}" minlength="2" maxlength="120" ${intakeBusy?'disabled':''}></label><p class="inquiry-status">${intakeReady?'Ready to generate':'Brief collected · follow-up questions optional'}</p><p class="muted small">${intakeDraft.brief.length.toLocaleString()} characters collected${intakeSourceFilename?' · '+esc(intakeSourceFilename):''}</p><label>Workflow<select id="inquiry-mode" ${intakeBusy?'disabled':''}><option value="automatic">Generate everything automatically</option><option value="reviewed">Pause for human review</option></select></label>`:''}
            <div><h3>What your AI team prepares</h3><ul class="deliverable-list"><li>Requirements and proposal</li><li>Business requirements document</li><li>UI/UX specification</li><li>Implementation blueprint</li><li>Testing and UAT plan</li><li>Documentation and training plan</li><li>Complete handover pack</li></ul></div>
            <button id="generate-inquiry" class="button" ${!intakeDraft||intakeBusy?'disabled':''}>${intakeBusy?'Working…':'Generate delivery pack →'}</button>
            <p class="muted small">Automatic mode runs all planning agents from your brief without approval stops.</p>
            <button class="button ghost" id="advanced-inquiry" ${intakeBusy?'disabled':''}>Use detailed form</button>
          </aside>
        </div>`;
      document.querySelector('#chat-form').onsubmit=sendInquiry;
      document.querySelector('#requirements-file').onchange=uploadRequirements;
      document.querySelector('#generate-inquiry').onclick=generateInquiry;
      document.querySelector('#advanced-inquiry').onclick=showAdvancedCreate;
      const composer=document.querySelector('#chat-input');
      composer.oninput=()=>{intakeComposer=composer.value;};
      composer.onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault(); document.querySelector('#chat-form').requestSubmit();}};
      const projectName=document.querySelector('#inquiry-project-name');
      if(projectName) projectName.oninput=()=>{intakeDraft.project_name=projectName.value; saveIntake();};
      const log=document.querySelector('#chat-messages');
      log.scrollTop=log.scrollHeight;
    }
    async function collectInquiry(content, display='') {
      const next=[...intakeMessages,{role:'user',content,display}];
      const response=await api('/intake/chat',{method:'POST',body:JSON.stringify({messages:next.map(({role,content})=>({role,content}))})});
      intakeMessages=[...next,{role:'assistant',content:response.reply}];
      intakeDraft=response.draft; intakeReady=response.ready; intakeAI=response.ai_enabled;
      saveIntake();
    }
    async function sendInquiry(event) {
      event.preventDefault();
      if(intakeBusy) return;
      const content=document.querySelector('#chat-input').value.trim();
      if(!content) return toast('Write your requirements or attach a document.');
      intakeComposer=content; intakeBusy=true; renderInquiry();
      try {await collectInquiry(content); intakeComposer='';}
      catch(error) {toast(error.message);}
      finally {intakeBusy=false; if(!selected) {renderInquiry(); document.querySelector('#chat-input').focus();}}
    }
    async function uploadRequirements(event) {
      const file=event.target.files[0];
      if(!file||intakeBusy) return;
      if(file.size>2*1024*1024) {event.target.value=''; return toast('Please upload a document smaller than 2 MB.');}
      intakeBusy=true; renderInquiry();
      try {
        const form=new FormData(); form.append('file',file);
        const extracted=await api('/intake/document',{method:'POST',body:form});
        await collectInquiry(extracted.text,`Uploaded ${extracted.filename} · ${extracted.characters.toLocaleString()} characters read`);
        intakeSourceFilename=extracted.filename; saveIntake();
      } catch(error) {toast(error.message);}
      finally {intakeBusy=false; if(!selected) renderInquiry();}
    }
    async function generateInquiry() {
      if(intakeBusy||!intakeDraft) return;
      const name=document.querySelector('#inquiry-project-name').value.trim();
      if(name.length<2) return toast('Give your project a name with at least two characters.');
      const mode=document.querySelector('#inquiry-mode').value;
      const body={...intakeDraft,project_name:name,execution_mode:mode};
      intakeBusy=true; renderInquiry();
      try {
        selected=await api('/projects',{method:'POST',body:JSON.stringify(body)});
        await loadProjects();
        toast(selected.status==='failed'?'Workflow needs attention. See the error.':mode==='automatic'?'Your complete delivery pack is ready.':'Your brief is ready for scope review.');
        intakeMessages=[]; intakeDraft=null; intakeReady=false; intakeSourceFilename=''; saveIntake();
      } catch(error) {toast(error.message);}
      finally {intakeBusy=false; if(!selected) renderInquiry();}
    }
    const lines = value => value.split('\n').map(v=>v.trim()).filter(Boolean);
    async function createProject(event) {
      event.preventDefault();
      const form=new FormData(event.target);
      const body=Object.fromEntries(form.entries());
      ['goals','target_users','platforms','integrations','constraints'].forEach(key=>body[key]=lines(body[key]||''));
      ['timeline','budget'].forEach(key=>{if(!body[key]?.trim()) delete body[key];});
      await submitForm(event.target, 'Creating workspace…', async()=>{
        selected=await api('/projects',{method:'POST',body:JSON.stringify(body)});
        await loadProjects();
        toast(selected.status==='failed' ? 'Workspace needs attention. See the workflow error.' : 'Workspace created. Your generated delivery pack is ready.');
      });
    }
    async function selectProject(id) { try { selected=await api('/projects/'+id); renderProjectList(); renderDetail(); } catch(error) { toast(error.message); } }
    function stageClass(stage) { const current=selected?.current_stage||''; const currentIndex=stages.findIndex(s=>s[0]===current); const index=stages.findIndex(s=>s[0]===stage); return index<currentIndex || ['completed','pack_ready'].includes(selected?.status) ? 'done' : index===currentIndex ? 'current' : ''; }
    function renderSteps() {
      const automatic=selected?.input.execution_mode==='automatic';
      const visible=automatic?stages.filter(stage=>!['delivery_review','uat'].includes(stage[0])):stages;
      return `<div class="steps">${visible.map(stage=>`<div class="step ${stageClass(stage[0])}"><span class="step-dot"></span>${automatic&&stage[0]==='handover'?'Delivery pack':stage[1]}</div>`).join('')}</div>`;
    }
    function agentTeamMarkup() { return `<div class="agent-list">${agentCatalog.map(agent=>`<div class="agent-card"><strong>${esc(agent.name)}</strong><small>${esc(agent.role)} · ${esc(agent.stage)}</small><p>${esc(agent.description)}</p><span class="agent-status ${esc(agent.status)}">${esc(agent.status)}</span></div>`).join('')}</div>`; }
    function gateCard(gate) { if(!gate) return ''; const isUat=gate.stage==='uat'; return `<div class="card gate"><div class="card-header"><div><p class="eyebrow">Human checkpoint</p><h2>${esc(gate.title)}</h2></div><span class="badge">Action needed</span></div><p class="muted">${esc(gate.description)}</p>${gate.questions.map(q=>`<div class="question">${esc(q)}</div>`).join('')}<form id="gate-form"><label>Feedback / decision notes<textarea name="feedback" placeholder="Add decisions, evidence, or requested changes…"></textarea></label><div class="actions"><button class="button" name="decision" value="${isUat?'pass':'approve'}">${isUat?'Pass UAT & hand over':'Approve & continue'}</button>${isUat?'<button class="button secondary" name="decision" value="fail">Fail UAT</button>':''}<button class="button secondary" name="decision" value="request_changes">Request changes</button><button class="button danger" name="decision" value="reject">Reject / stop</button></div></form></div>`; }
    function artifactCard(artifact) { return `<div class="artifact"><strong>${esc(artifact.title)}</strong><small>v${artifact.version} · ${esc(artifact.generated_by.join(', '))}</small><br><button onclick="showArtifact('${artifact.kind}')">Open artifact</button></div>`; }
    function renderDetail() { if(!selected) return showCreate(); const input=selected.input; const gate=selected.gates.find(g=>g.id===selected.active_gate_id); const metric=selected.metrics||{}; document.querySelector('#main').innerHTML=`<div class="topline"><div><p class="eyebrow">${esc(input.client_name)} · ${esc(input.project_type.replaceAll('_',' '))}</p><h1>${esc(input.project_name)}</h1><p class="subtitle">${esc(input.brief.length>450?input.brief.slice(0,450)+'…':input.brief)}</p></div><span class="badge">${esc(selected.status.replaceAll('_',' '))}</span></div><div class="grid"><div class="card">${renderSteps()}</div>${gate?gateCard(gate):''}${selected.status==='pack_ready'?'<div class="card"><h2>Your delivery pack is ready</h2><p class="muted">All seven planning deliverables have been generated. Open them below to review the scope, design, implementation blueprint, and test plan.</p></div>':''}${selected.error?`<div class="card" role="alert"><h2>Workflow needs attention</h2><p>${esc(selected.error)}</p></div>`:''}<div class="card"><div class="card-header"><div><h2>Delivery cockpit</h2><div class="muted small">A source-grounded artifact pack with a visible audit trail.</div></div></div><div class="stats"><div class="stat"><b>${selected.requirements.length}</b><span>requirements</span></div><div class="stat"><b>${selected.artifacts.length}</b><span>artifacts</span></div><div class="stat"><b>${input.execution_mode==='automatic'?'Auto':'Reviewed'}</b><span>workflow</span></div><div class="stat"><b>${metric.open_questions?.length||0}</b><span>open questions</span></div></div></div><div class="card"><div class="card-header"><div><h2>Agent team</h2><div class="muted small">Every stage has an explicit role, responsibility, contract, and approval boundary.</div></div><span class="muted small">${agentCatalog.length} roles</span></div>${agentTeamMarkup()}</div><div class="card half"><div class="card-header"><h2>Generated work</h2><span class="muted small">${selected.artifacts.length} items</span></div><div class="artifact-list">${selected.artifacts.length?selected.artifacts.map(artifactCard).join(''):'<div class="muted small">Artifacts appear after scope confirmation.</div>'}</div></div><div class="card half"><div class="card-header"><h2>Requirement register</h2><span class="muted small">Stable traceable IDs</span></div><div style="display:grid;gap:8px;max-height:280px;overflow:auto">${selected.requirements.map(item=>`<div class="artifact"><strong>${esc(item.id)} · ${esc(item.category)}</strong><small>${esc(item.statement)}</small></div>`).join('')}</div></div><div class="card half"><div class="card-header"><h2>Agent workflow trace</h2><span class="muted small">${selected.trace.length} events</span></div><div class="trace">${selected.trace.slice().reverse().map(row=>`<div class="trace-row"><time>${new Date(row.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</time><div><strong>${esc(row.agent.replaceAll('_',' '))}</strong><span>${esc(row.message)}</span></div></div>`).join('')}</div></div><div class="card half"><div class="card-header"><h2>Open decisions</h2><span class="muted small">Keep uncertainty explicit</span></div>${(selected.decisions.length?selected.decisions: (metric.open_questions?.length?metric.open_questions.map(q=>({decision:'To clarify',feedback:q})):[{decision:'No open decisions',feedback:'Your submitted requirements are included in the delivery pack.'}])).map(d=>`<div class="question"><strong>${esc(d.decision)}</strong><br><span class="muted">${esc(d.feedback||'No additional notes')}</span></div>`).join('')}</div></div>`; const gateForm=document.querySelector('#gate-form'); if(gateForm) gateForm.onsubmit=respondGate; }
    async function respondGate(event) {
      event.preventDefault();
      const decision=event.submitter?.value || (selected.current_stage==='uat'?'pass':'approve');
      const feedback=new FormData(event.target).get('feedback')||'';
      const projectId=selected.id, gateId=selected.active_gate_id;
      await submitForm(event.target, 'Processing decision…', async()=>{
        selected=await api(`/projects/${projectId}/gates/${gateId}/respond`,{method:'POST',body:JSON.stringify({decision,feedback})});
        await loadProjects();
        toast(selected.status==='failed' ? 'Workflow needs attention. See the error.' : decision==='request_changes'?'Revision cycle started.':'Decision recorded.');
      });
    }
    async function showArtifact(kind) { try { const artifact=await api(`/projects/${selected.id}/artifacts/${kind}`); document.querySelector('#main').innerHTML=`<div class="topline"><div><p class="eyebrow">Artifact · ${esc(kind)}</p><h1>${esc(artifact.title)}</h1><p class="subtitle">Generated by ${esc(artifact.generated_by.join(', '))} · version ${artifact.version}</p></div><button class="button ghost" onclick="selectProject('${selected.id}')">← Back to cockpit</button></div><div class="card"><pre>${esc(pretty(artifact.content))}</pre></div>`; } catch(error) { toast(error.message); } }
    showCreate();
    loadProjects().catch(error=>{document.querySelector('#project-list').textContent='Workspace unavailable. Reload to retry.'; toast(error.message);});
  </script>
</body>
</html>
