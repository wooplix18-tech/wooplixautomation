[project]
name = "wooplix-automation-langgraph"
version = "0.1.0"
description = "AI-assisted software delivery orchestration for websites, mobile apps, and software products"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
langgraph = ["langgraph>=1.0,<2"]
dev = ["httpx>=0.27,<1"]

[project.scripts]
automation-server = "app.main:run"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
