[project]
name = "wooplix-automation-langgraph"
version = "0.1.0"
description = "AI-assisted software delivery orchestration for websites, mobile apps, and software products"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "uvicorn[standard]==0.54.0",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "pypdf==6.20.0",
    "python-docx==1.2.0",
    "langgraph==1.2.14",
    "groq==1.7.0",
    "requests==2.34.2",
    "certifi==2026.7.22",
]

[project.optional-dependencies]
langgraph = ["langgraph>=1.0,<2"]
dev = ["httpx>=0.27,<1"]

[project.scripts]
automation-server = "app.main:run"

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
